# Windows builds go through cargo-xwin (see build.sh), which downloads the MSVC
# CRT/SDK and configures clang-cl / lld-link itself, so nothing here is tied to
# one machine. Use:
#   cargo xwin build --target x86_64-pc-windows-msvc
#   cargo xwin check --target x86_64-pc-windows-msvc
#   cargo xwin test  --target x86_64-pc-windows-msvc --lib     (runs under Wine)
